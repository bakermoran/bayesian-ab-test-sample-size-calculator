[project]
name = "sample_size"
version = "0.1.0"
description = "A website for Bayesian AB Test sample size estimation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Baker Moran", email = "baker.moran@gmail.com" }]
keywords = ["AB Test", "Bayes", "Bayesian Statistics", "Sample Size"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
dependencies = [
    "apispec>=6.10.0",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "numpy>=2.5",
    "scipy>=1.18",
    "webargs>=8.7.1",
]

[dependency-groups]
dev = [
    "pylint>=4.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
# pycodestyle, pyflakes, pydocstyle, isort
select = ["E", "W", "F", "D", "I"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pylint.typecheck]
# scipy.special functions are C ufuncs pylint can't see statically
generated-members = ["sc\\.beta.*"]

[tool.pylint.design]
# The sample size route and function take one argument per query parameter
max-args = 6
max-positional-arguments = 6
